<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add Product</title>
</head>
<body>

<h1>Add Product</h1>

<form th:action="@{/products/add}"
      th:object="${product}"
      method="post">

    <label>Product Name:</label>
    <input type="text" th:field="*{productName}">
    <span th:if="${#fields.hasErrors('productName')}"
          th:errors="*{productName}"></span>

    <br><br>

    <label>Description:</label>
    <input type="text" th:field="*{productDescription}">
    <span th:if="${#fields.hasErrors('productDescription')}"
          th:errors="*{productDescription}"></span>

    <br><br>

    <label>Price:</label>
    <input type="number" step="0.01" th:field="*{productPrice}">
    <span th:if="${#fields.hasErrors('productPrice')}"
          th:errors="*{productPrice}"></span>

    <br><br>

    <label>Quantity:</label>
    <input type="number" th:field="*{productQuantity}">
    <span th:if="${#fields.hasErrors('productQuantity')}"
          th:errors="*{productQuantity}"></span>

    <br><br>

    <label>Image:</label>
    <input type="text" th:field="*{productImage}">

    <br><br>

    <label>Category:</label>
    <select th:field="*{categoryId}">
        <option value="">Select category</option>
        <option th:each="category : ${categories}"
                th:value="${category.id}"
                th:text="${category.categoryName}">
        </option>
    </select>
    <span th:if="${#fields.hasErrors('categoryId')}"
          th:errors="*{categoryId}"></span>

    <br><br>

    <button type="submit">Add Product</button>

</form>

</body>
</html>
